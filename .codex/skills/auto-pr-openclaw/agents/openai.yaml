interface:
  display_name: "OpenClaw PR Workflow"
  short_description: "Prepare OpenClaw PRs with deterministic checks"
  default_prompt: "Use $auto-pr-openclaw to prepare or maintain an OpenClaw PR with canonical worktrees, executable checks, durable proof, and automatic GitHub publication when the gate passes; use an evidence-backed agent judgment only for allowlisted external blockers, request human approval for local or uncertain blockers, and honor explicit workflow-rule bypasses."
