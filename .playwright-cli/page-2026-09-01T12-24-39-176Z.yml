                    - heading "What Problem This Solves" [level=2] [ref=e241]
                    - paragraph [ref=e242]: Fixes an issue where Control UI Workboard cards stayed visible and their incoming dependency links remained until the Gateway acknowledged deletion.
                    - paragraph [ref=e243]:
                      - text: Fixes
                      - link "#134159" [ref=e244] [cursor=pointer]:
                        - /url: https://github.com/openclaw/openclaw/issues/134159
                    - heading "Why This Change Was Made" [level=2] [ref=e245]
                    - paragraph [ref=e246]: The delete action now applies the predictable local projection immediately after sending the Gateway request. While that request is pending, every concurrent card response keeps the deleted card and its incoming links out of the local projection. A rejected request restores only the deleted card and the incoming links captured by that mutation, preserving successful writes to other cards; the Gateway response remains authoritative.
                    - heading "User Impact" [level=2] [ref=e247]
                    - paragraph [ref=e248]: Deleted Workboard cards and their incoming dependency links disappear immediately instead of waiting for a round trip. If the Gateway rejects the delete, the card and links return with the Gateway error visible.
