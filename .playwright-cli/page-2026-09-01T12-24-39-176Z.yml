                                - strong [ref=e529]: Compose rollback state for overlapping card deletes (P2)
                                - text: "- If a parent deletion removes a child's link, then the child is deleted before the parent request rejects, this snapshot records the child without its original link. Rejecting the parent skips restoration because the child is absent; rejecting the child then restores no link, so two failed requests leave the dependency missing until reload. Track overlapping optimistic removals as one composable projection and add this rejection order."
