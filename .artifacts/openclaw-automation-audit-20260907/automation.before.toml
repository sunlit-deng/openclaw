version = 1
id = "openclaw-pr"
kind = "cron"
name = "OpenClaw PR 问题闭环修复与自动发布（独立运行）"
prompt = "使用 $auto-pr-openclaw 技能，在当前项目中维护 openclaw/openclaw 上已经发布的 contributor PR。\n\n核心目标不是“定期扫描并生成报告”，而是解决 PR 的实际问题、补齐测试和真实 proof、回应 ClawSweeper/reviewer 的具体扣分项，并在验证通过后提交和发布，尽可能提升当前 head 的评分。每次运行都要把一个可处理 PR 推进到以下终态之一：published、明确的 needs-user-decision、或有证据的 external-blocked。第一次测试失败、第一次冲突收据失败、旧 worktree、缺依赖、网络超时、CI 失败或评分下降都不是终态，必须先诊断根因并继续修复。\n\n此任务只维护已经发布的 PR：\n- 不筛选新候选，不创建新 PR，不创建 issue；\n- 不发表评论，不请求 review，不自动请求 @clawsweeper re-review；\n- 允许在 gate 清零后按技能规则自动提交和推送现有 PR；\n- 不得绕过账号、HEAD/body、目标分支、租约、maintainer edit、冲突收据或其他硬安全门。\n\n一、每轮先做实时 intake 和排序\n\n1. 读取 workspace/openclaw/accounts.json 中的 sunlit 和 jjy 配置，只处理 PR author 为 sunlit-deng 或 RileyJJY 的开放 PR。必须分开核对 PR author、live head owner、head ref、最新提交 author/committer 和实际使用的 GitHub profile；提交/推送使用 live head owner 对应的 profile。无法确认 owner 或权限时，记录 ownership blocker，不得猜测写入。\n2. 对每个开放 PR 先读取当前 head SHA、目标分支、mergeable/conflict 状态、当前 head 对应的 ClawSweeper 评分/等级及评分 head、最新 CI 摘要和 review 更新时间。\n3. 以下任一条件满足就进入维护：当前评分低于 Platinum；存在真实合并冲突；存在未解决的具体 P1/P2、ClawSweeper 扣分项、维护者/reviewer 请求、PR-caused CI/test failure。无当前评分且没有真实冲突、没有具体 review/CI 问题的 PR 才 skipped。\n4. 按真实冲突优先、问题严重程度优先、PR 编号从大到小、评论新旧排序。一个 PR 有本机可修复问题时，先把它推进到修复并验证完成，不要因为第一次失败就跳到“放弃”。只有确认是用户/维护者决策或不可替代的外部 blocker，才转到下一个 PR。\n\n二、问题闭环：发现 → 根因 → 修复 → 复验 → 发布\n\n对每个入选 PR 必须执行下面的闭环；不要把“已读取评论”“已发现 blocker”“留下未提交修改”当作完成。\n\n1. 使用技能规定的 canonical worktree 和 prepare-openclaw-pr-worktree.mjs --pr <number>，从 live PR head 开始。发现 worktree 旧、分叉、损坏或不完整时，先基于当前 live head 创建干净 worktree；不要把旧 worktree 当成当前 head 继续验证，也不要盲目 reset、盲目 rebase 或修改主 clone。\n2. 读取最新评论、未解决 review threads、ClawSweeper review、维护者意见、CI 结果和当前 diff。对每个具体问题写出并执行映射：\n   - 症状和用户影响；\n   - 证据和可复现输入；\n   - 根因及责任范围；\n   - 最小代码/测试/配置修复；\n   - focused test、类型/lint、真实生产边界 proof；\n   - 预期解决的评分扣分项。\n3. 失败必须当作诊断信号处理：\n   - 先读取失败命令的精确输出，定位是代码逻辑、测试断言、worktree/基线、依赖/工具、环境、网络、上游变化还是无关 CI；\n   - 本地代码/测试/配置问题必须修改后复验；\n   - 依赖、Docker、工具或环境问题先修复环境、重建必要产物并重跑受影响的窄检查；\n   - 网络或上游问题要收集可验证证据，并确认不是本地状态造成；\n   - 同一命令不能无理由原样重复；每次重试都必须有明确诊断、修复或状态变化。\n4. 只使用与当前问题相关的最小验证范围，但不能用一次静态检查替代真实行为证明。能在本机解决的 proof 必须解决；需要 Docker 时先检查并尝试启动本机 Docker。对 body-size、WebSocket maxPayload 等边界必须同时证明合法输入成功和超限输入被拒绝。\n5. 如果代码、测试或 proof 已经完成，必须继续执行 PR body 证据更新、openclaw-preflight、openclaw-gate-summary、提交和发布。不能因为“本地已经修好”就停止在隔离 worktree。\n\n三、冲突、rebase 和 patch drift 的专项处理\n\n1. 真实冲突必须使用 conflict-resolution fast path：先执行 scripts/openclaw-conflict-rebase.sh --phase start，固定一次 target SHA；后续冲突先执行 --phase record；只解决记录的冲突文件。\n2. 当前 review/CI 修复如果确实需要改动冲突文件之外的少量文件，先把每个文件写入 validation plan 的 allowedFiles，并为每个非文档改动配套 focused test 或直接边界检查，再执行 --phase finish --plan <plan.json>。不能等 receipt 失败后默默扩大 scope。\n3. 当 conflict receipt 第一次失败时，不要只输出“receipt blocked”。必须读取收据中的具体失败项，查明：\n   - 哪些文件超出了记录范围；\n   - 哪些 patch-id 或 net patch 发生变化；\n   - 变化来自旧/分叉 worktree、意外 churn、生成文件、当前 review 修复，还是上游语义变化；\n   - 原 PR 意图是否仍然可以在当前 main 上安全保留。\n4. 对可修复的 receipt 失败，立即采取对应动作并复验：\n   - worktree/基线问题：从 live PR head 重新创建 canonical worktree，重新固定 target SHA 并重走 start/record/finish；\n   - 当前 review 修复确实属于本次维护：在 finish 前显式加入 allowedFiles，并补上匹配的 focused validation；\n   - 意外改动：只清理已确认的意外改动，不删除用户需要的本地修复；\n   - 上游语义变化：调整实现和回归测试以适配当前上游，同时保留原 PR 用户目标，再重新生成 receipt。\n   第一次 receipt 失败后至少完成一轮“读取失败证据 → 判断原因 → 有界修复/重建 → 再验证”，不能直接结束。\n5. 只有在干净当前 head、固定 target、显式 scope 和有界 validation plan 都已经重新建立，并且 receipt 仍然明确拒绝，或出现需要维护者决定的产品/兼容性/所有权选择时，才标记 needs-user-decision。此时必须报告精确文件、命令、证据、已尝试的修复和需要用户决定的选项；不得把本地 patch drift 伪装成 external blocker，不得使用 workflow-rule bypass，不得盲推。\n6. 不能因为旧版任务留下过 cooldown-skipped 或 blocked 记录就跳过仍有具体问题的 PR。先读取当前 live 状态和已有本地进展，恢复问题闭环；旧记录只能作为上下文，不能作为终态。\n\n四、评分提升和发布门禁\n\n1. 以当前 head 对应的 ClawSweeper/reviewer 反馈为目标，逐条处理所有有证据且可执行的 P1/P2、评分扣分项、测试/proof 缺口和 CI 问题。不要为刷分做没有问题依据的泛化重构，也不要承诺具体等级。\n2. Proof 必须尽量使用相同生产入口、相同输入和相同边界依赖做 base/head 对照，并保留 negative control。必要证据写入 PR body，PR body 不能出现本机绝对路径、outputs、worktrees 或秘密。\n3. 所有提交使用选定 profile 的 username/email。任何远端写入前重新核对当前 HEAD/body hash、PR author、live head owner/ref、目标分支、force-with-lease、maintainerCanModify、gate summary 和账号身份。\n4. 只有 automaticPublication.eligible=true 且 blockers 为空，或所有剩余 blocker 都满足技能允许的 evidence-backed external judgment，才调用技能指定的 publisher。远端发布后重新读取并验证 PR head、body、作者、head owner、目标分支、ready 状态和 maintainer edit。\n5. 不自动发表评论或 re-review。发布是该次维护的成功终态；若 gate 有本地 blocker，继续修复对应问题，不要只报告“门禁失败”。\n\n五、持久状态和输出\n\n1. 在自动化记忆或对应 workflow 输出中保存每个 PR 的当前 head、问题映射、根因、已完成改动、验证结果、当前失败命令、已尝试的修复和下一步具体动作。下一轮必须从这些进展继续，不要从头重复扫描或丢弃隔离 worktree 的可用修复。\n2. 每个 PR 只使用以下结果状态：\n   - published：已提交、推送并完成远端核验；\n   - needs-user-decision：本地修复路径已经穷尽，必须由用户/维护者决定产品、兼容性、所有权或安全范围；\n   - external-blocked：有证据证明依赖不可替代的外部服务/基础设施，且本机替代不可行；\n   - skipped：不满足筛选条件。\n   不得把一次失败、一次超时、一次 receipt 失败、旧 worktree 或“暂时没跑 proof”写成最终失败。\n3. 运行日志必须直接回答：PR 的具体问题是什么、根因是什么、改了什么、跑了哪些验证、评分改善目标是什么、是否已经写入远端、若未发布还缺什么，以及下一步具体动作。不要只输出“执行失败”“稍后重试”。\n4. 运行结束时汇总各 PR 的状态、当前 head、实际改动、验证/proof、发布结果和需要用户决定的事项。主 clone、用户未完成改动和其他 PR 工作流必须保持不变。"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=1,5,9,13,17,21;BYMINUTE=0;BYSECOND=0"
